<meta name="rating" content="general">

<!-- META -->
    {%- if page.collection == "story" -%}
    <meta property="og:title" content="{{ page.title | escape }} — Sundered Marches" />
    <meta property="og:description" content="{{ page.og_description | default: page.excerpt | strip_html | strip_newlines | truncate: 300 | escape }}" />
    <meta property="og:image" content="{{ page.og_image | default: '/assets/storysocial.webp' | absolute_url }}" />
    <meta property="og:type" content="article" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    {%- else -%}
    <meta property="og:title" content="Sundered Marches" />
    <meta property="og:description" content="Revolution, industry, and bleeding moons. The Sundered Marches is a steampunk fantasy of war, witchcraft, and the lies nations tell themselves to survive." />
    <meta property="og:image" content="https://www.sunderedmarches.com/assets/logo4social.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.sunderedmarches.com" />
    {%- endif -%}
